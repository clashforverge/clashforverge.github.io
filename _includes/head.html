<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.keywords and page.keywords != "" %}
    <meta name="keywords" content="{{ page.keywords | escape }}">
  {% elsif site.keywords %}
    <meta name="keywords" content="{{ site.keywords | escape }}">
  {% endif %}
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#071b38">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Noto Sans SC', 'system-ui', 'sans-serif'],
            mono: ['DM Mono', 'monospace']
          },
          colors: {
            ink: '#071b38',
            ocean: '#123b7a',
            signal: '#2f9bff',
            mist: '#eef6ff'
          },
          boxShadow: {
            soft: '0 18px 50px rgba(8, 40, 83, 0.12)',
            glow: '0 16px 40px rgba(47, 155, 255, 0.26)'
          }
        }
      }
    }
  </script>

  {% if page.layout == 'post' %}
    {% assign post_desc = page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 155 %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": "{{ page.title | escape }}",
      "datePublished": "{{ page.date | date_to_xmlschema }}",
      "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
      "description": "{{ post_desc | escape }}",
      "author": {"@type": "Organization", "name": "{{ site.author | escape }}"},
      "publisher": {"@type": "Organization", "name": "{{ site.title | escape }}"},
      "mainEntityOfPage": {"@type": "WebPage", "@id": "{{ page.url | absolute_url }}"}
    }
    </script>
  {% else %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "{{ site.url }}",
      "name": "{{ site.title | escape }}",
      "description": "{{ site.description | escape }}"
    }
    </script>
  {% endif %}

  {% seo %}
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">

  <style>
    :root { --ink: #071b38; --ocean: #123b7a; --signal: #2f9bff; --mist: #eef6ff; --line: rgba(18,59,122,.12); }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 96px; }
    body { margin: 0; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #13233d; background: #f7fbff; }
    body::selection { background: #bde7ff; color: #071b38; }
    a { text-decoration: none; }
    .site-main { min-height: 70vh; }
    .site-grid { background-image: linear-gradient(rgba(47,155,255,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(47,155,255,.055) 1px, transparent 1px); background-size: 28px 28px; }
    .eyebrow { display: inline-flex; align-items: center; gap: .55rem; font: 500 .74rem/1 'DM Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: #287fd2; }
    .eyebrow::before { content: ''; width: 1.8rem; height: 1px; background: currentColor; }
    .section-heading { max-width: 43rem; }
    .section-heading h2 { margin: .65rem 0 .9rem; color: #071b38; font-size: clamp(1.85rem, 3.2vw, 2.8rem); line-height: 1.18; font-weight: 800; letter-spacing: -.04em; }
    .section-heading p { margin: 0; color: #5e708c; line-height: 1.85; }
    .button-primary, .button-secondary { display: inline-flex; align-items: center; justify-content: center; gap: .55rem; border-radius: .85rem; padding: .85rem 1.1rem; font-weight: 700; transition: transform .2s ease, box-shadow .2s ease, background .2s ease; }
    .button-primary { color: #06234b; background: linear-gradient(135deg, #67e8f9, #60a5fa); box-shadow: 0 12px 30px rgba(63, 183, 255, .26); }
    .button-secondary { color: #d7edff; border: 1px solid rgba(176,221,255,.3); background: rgba(255,255,255,.07); }
    .button-primary:hover, .button-secondary:hover { transform: translateY(-2px); }
    .button-primary:focus-visible, .button-secondary:focus-visible, a:focus-visible, button:focus-visible { outline: 3px solid #67e8f9; outline-offset: 3px; }
    .article-prose { color: #374b68; font-size: 1rem; line-height: 1.9; }
    .article-prose h2, .article-prose h3 { color: #071b38; letter-spacing: -.02em; }
    .article-prose a { color: #126cc4; font-weight: 600; }
    [data-theme="dark"] body { color: #daeafa; background: #071424; }
    [data-theme="dark"] .bg-white { background-color: #102440 !important; }
    [data-theme="dark"] .text-gray-900, [data-theme="dark"] .text-slate-900 { color: #e8f4ff !important; }
    [data-theme="dark"] .text-gray-600, [data-theme="dark"] .text-slate-600 { color: #9db2cb !important; }
    [data-theme="dark"] .border-slate-100, [data-theme="dark"] .border-gray-100 { border-color: rgba(172,215,255,.12) !important; }
  </style>
</head>
